[package]
name = "secmatch"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://santh.dev"
description = "Pattern matching engine  -  Aho-Corasick + RegexSet fusion, DSL evaluator, extractors"
repository = "https://github.com/santhreal/secmatch"
keywords = ["security", "pattern-matching"]

[package.metadata.santh]
status = "beta"

[dependencies]
secir = { path = "../secir", version = "0.3.2" }
aho-corasick = "=1.1.4"
regex = "=1.12.3"
rustc-hash = "=2.1.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
tracing = "=0.1.44"
chrono = { version = "=0.4.44", features = ["serde"] }
smallvec = "=1.15.1"
hex = "=0.4.3"
encodex = { package = "santh-encodex", version = "0.1.13", path = "../../performance/compression/encodex" }
urlencoding = "=2.1.3"
flate2 = "=1.1.9"
hashkit = { path = "../../performance/indexing/hashkit", version = "0.1.3" }
md5 = "=0.8.0"
sha1 = "=0.11.0"
clap = { version = "=4.6.1", features = ["derive"] }
rand = "0.8"
guise-choice = { path = "../../runtime/guise-choice", version = "0.1.1" }
rayon = "1.10"
serde_yaml = "=0.9.34"
toml = "=0.8.23"
gjson = "=0.8.1"
base64 = "=0.21.7"

[dev-dependencies]
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tempfile = "=3.27.0"
sigma = { package = "santh-sigma", path = "../sigma", version = "0.1.1" }
criterion = "=0.5.1"
proptest = "=1.9.0"
# calyx-compiler = { path = "../../../web/calyx/crates/compiler" }

[workspace]
